name: colegio

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-colegio}
      POSTGRES_USER: ${DB_USER:-colegio}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - datos-db:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - red-datos
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./backend
      target: produccion
    image: ${IMAGEN_PREFIJO:-colegio}-api:${TAG:-local}
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-colegio}
      DB_USER: ${DB_USER:-colegio}
      DB_PASSWORD_FILE: /run/secrets/db_password
      APP_VERSION: ${TAG:-local}
    secrets:
      - db_password
    depends_on:
      db:
        condition: service_healthy
    networks:
      - red-datos
      - red-web
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/salud').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  web:
    build:
      context: ./frontend
      target: produccion
      args:
        VITE_APP_VERSION: ${TAG:-local}
    image: ${IMAGEN_PREFIJO:-colegio}-web:${TAG:-local}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - red-web

  adminer:
    image: adminer:5
    profiles: ["herramientas"]
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8081:8080"
    depends_on:
      - db
    networks:
      - red-datos
      - red-web

networks:
  red-web:
  red-datos:
    internal: true

volumes:
  datos-db:

secrets:
  db_password:
    file: ./secrets/db_password.txt
