# Alternativa a los bind mounts de compose.dev.yaml (Módulo 5.7) para Docker Desktop en Windows,
# donde los cambios en un bind mount no generan eventos dentro del contenedor.
# Uso: docker compose -f compose.yaml -f compose.dev.yaml -f compose.watch.yaml up --build --watch
services:
  api:
    volumes: !reset []
    develop:
      watch:
        - action: sync
          path: ./backend/src
          target: /app/src
        - action: rebuild
          path: ./backend/package.json

  web:
    volumes: !reset []
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src
        - action: sync
          path: ./frontend/index.html
          target: /app/index.html
        - action: rebuild
          path: ./frontend/package.json
