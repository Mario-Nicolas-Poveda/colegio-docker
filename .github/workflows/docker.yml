name: Construir y publicar imágenes

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  pruebas:
    name: Pruebas del backend (dentro de Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Construir la etapa "pruebas" (ejecuta npm test)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: pruebas
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  publicar:
    name: Publicar ${{ matrix.servicio }}
    needs: pruebas
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - servicio: api
            contexto: ./backend
          - servicio: web
            contexto: ./frontend
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Calcular etiquetas (semver, sha y latest)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/colegio-${{ matrix.servicio }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexto }}
          target: produccion
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.servicio }}
          cache-to: type=gha,scope=${{ matrix.servicio }},mode=max
