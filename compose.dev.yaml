services:
  api:
    build:
      target: desarrollo
    image: colegio-api:dev
    environment:
      NODE_ENV: development
    volumes:
      - ./backend/src:/app/src
    ports:
      - "3000:3000"

  web:
    build:
      target: desarrollo
    image: colegio-web:dev
    environment:
      VITE_API_PROXY: http://api:3000
      VITE_USE_POLLING: ${VITE_USE_POLLING:-false}
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    ports: !override
      - "5173:5173"
